name: Build IPF-Gazelle

on: [push, pull_request, workflow_dispatch]

env:
  MAVEN_OPTS: -Xmx2048m
  # JDK used for dependency submission and deployment; the other JDKs only build and test
  DEPLOY_JAVA_VERSION: '17'

# on download timeouts, consider to disable connection pooling
# -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.http.retryHandler.count=3
# or consider to restrict the ttl
#  -Dmaven.wagon.httpconnectionManager.ttlSeconds=120

jobs:
  build:
    runs-on: ubuntu-latest
    name: Java ${{ matrix.java }} build
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21', '25' ]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
          server-id: ossrh
          server-username: ${{ secrets.nexus_username }}
          server-password: ${{ secrets.nexus_password }}
          gpg-private-key: ${{ secrets.gpg_private_key }}
          gpg-passphrase: ${{ secrets.gpg_passphrase }}

      - name: Build with Maven
        run: mvn -B clean package --file pom.xml

      - name: Submit Dependency Snapshot
        if: matrix.java == env.DEPLOY_JAVA_VERSION
        uses: advanced-security/maven-dependency-submission-action@v5
        with:
          ignore-maven-wrapper: true

      - name: Write Maven settings
        if: matrix.java == env.DEPLOY_JAVA_VERSION
        env:
          SETTINGS_XML: ${{ secrets.PUBLISH_SETTINGS_XML }}
        run: printf '%s' "$SETTINGS_XML" > "$RUNNER_TEMP/settings-deploy.xml"

      - name: Deploy to Sonatype
        if: matrix.java == env.DEPLOY_JAVA_VERSION && github.ref == 'refs/heads/master'
        run: mvn -B deploy -DskipTests --settings "$RUNNER_TEMP/settings-deploy.xml"
